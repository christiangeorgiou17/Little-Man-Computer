<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Man Computer</title>
    <link rel="icon" href="https://christiangeorgiou.com/images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="https://christiangeorgiou.com/images/favicon.ico" sizes="32x32">
    <script src="./src/main.js" type="module" defer></script>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header></header>

    <main>
        <section id="code-input">
            <textarea type="text" title="Assembly Code" id="assembly-code-input" placeholder="" rows="10"></textarea>
            <button type="button" id="submit-button">Submit</button>
            <button type="button" id="run-button">Run</button>
            <button type="button" id="assemble-into-ram-button">Assemble Into RAM</button>
        </section>
        <section id="processor">
            <input type="number" title="Standard Input" id="standard-input" disabled>
            <ul id="standard-output"></ul>
            <ul id="registers">
                <li id="accumulator">0</li>
                <li id="program-counter">0</li>
                <li id="instruction-register">0</li>
                <li id="address-register">00</li>
            </ul>
            <ul id="memory"></ul>
        </section>
    </main>

    <footer></footer>
</body>
</html>
